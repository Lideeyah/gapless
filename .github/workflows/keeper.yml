name: keeper

# Same continuous pattern as the recorder: one run checks orders every 5 minutes for ~5h40m, then
# dispatches the next run of itself. Cron is only a backstop. Orders are written through the GitHub
# Contents API, not git push, so this job never pushes.

on:
  schedule:
    - cron: "9,39 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and simulate executions without sending"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: keeper
  cancel-in-progress: false

jobs:
  keeper:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install -q -r keeper/requirements.txt

      - name: Check orders every 5 minutes for ~5h40m and execute regime-aware stops
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          KEEPER_SECRET_KEY: ${{ secrets.KEEPER_SECRET_KEY }}
          PYTH_API_KEY: ${{ secrets.PYTH_API_KEY }}
          RPC_URL: ${{ vars.RPC_URL }}
          KEEPER_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          GIT_AUTHOR_NAME: Lydia Solomon
          GIT_AUTHOR_EMAIL: lydiasolomon137@gmail.com
        run: |
          if [ "${KEEPER_DRY_RUN}" = "1" ]; then python keeper/keeper.py; exit 0; fi   # a dry run is one pass and never owns the chain
          end=$((SECONDS + 5*3600 + 40*60))
          while [ "$SECONDS" -lt "$end" ]; do
            # pick up whatever is on main before each pass, so a push is live within five minutes without restarting the run
            if timeout 60 git fetch -q origin main 2>/dev/null; then
              if ! git diff --quiet HEAD origin/main -- keeper/requirements.txt; then pip install -q -r <(git show origin/main:keeper/requirements.txt) || true; fi
              git checkout -q origin/main -- keeper pyth.py recorder.py 2>/dev/null || echo "could not refresh code; running the checked-out version"
            fi
            python keeper/keeper.py || echo "keeper exited non-zero; continuing"
            sleep $((300 - $(date +%s) % 300))
          done

      - name: Hand off to the next run (unless one is already queued)
        if: always() && !inputs.dry_run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          queued=$(gh run list --workflow=keeper.yml --status queued --json databaseId --jq 'length')
          if [ "$queued" = "0" ]; then gh workflow run keeper.yml --ref main; else echo "a run is already queued; not dispatching"; fi
