name: record

# GitHub's cron is best-effort and, for this repository, fired three times in seven hours instead of
# every five minutes. So each run records continuously for ~5h40m (jobs are capped at 6h), committing
# every reading as it is taken, then dispatches the next run of itself. Cron remains only as a
# backstop that restarts the chain if a hand-off ever fails.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # to dispatch the next run

# Exactly one recorder at a time; a queued run waits for the current one instead of overlapping it.
concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Record every 5 minutes for ~5h40m, committing each reading as it is taken
        run: |
          git config user.name "Lydia Solomon"
          git config user.email "lydiasolomon137@gmail.com"
          end=$((SECONDS + 5*3600 + 40*60))
          while [ "$SECONDS" -lt "$end" ]; do
            timeout 120 python recorder.py || echo "recorder exited non-zero or timed out; continuing"
            git add data/prices.csv
            git commit -qm "record $(date -u +%Y-%m-%dT%H:%M:%SZ)" || true
            # Push race: if the branch moved (keeper or app commits), rebase and retry once.
            # The keeper commits to main through the API twice per cycle at the same seconds this push lands,
            # so one rebase-and-retry can lose the race every cycle. Retry up to six times, never leave a
            # rebase half-done, and never let a failed push stop the next reading.
            # Every network call gets a hard clock: a git push or pull that hangs would otherwise stall the
            # loop for the rest of the job, silently, with every later reading lost (seen twice on 2026-09-19).
            pushed=0
            for attempt in 1 2 3 4 5 6; do
              timeout 60 git push -q origin HEAD:main && pushed=1 && break
              git rebase --abort 2>/dev/null || true
              timeout 120 git pull --rebase -q origin main || git rebase --abort 2>/dev/null || true   # keep the local readings; try again next cycle
              sleep $((attempt * 2))
            done
            [ "$pushed" = "1" ] || echo "push failed after 6 attempts; the reading stays committed locally and rides with the next push"
            sleep $((300 - $(date +%s) % 300))
          done

      - name: Hand off to the next run (unless one is already queued)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          queued=$(gh run list --workflow=record.yml --status queued --json databaseId --jq 'length')
          if [ "$queued" = "0" ]; then gh workflow run record.yml --ref main; else echo "a run is already queued; not dispatching"; fi
