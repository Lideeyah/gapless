name: record

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes, best-effort (GitHub may delay or skip runs)
  workflow_dispatch:

permissions:
  contents: write

# One recorder at a time; a late run queues behind the current one rather than overlapping it.
concurrency:
  group: record
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Record prices (never fails the run; fetch errors become source=error rows)
        run: python recorder.py

      - name: Commit and push
        run: |
          git config user.name "Lydia Solomon"
          git config user.email "lydiasolomon137@gmail.com"
          git add data/prices.csv
          git commit -m "record $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Push race: if the remote moved, rebase onto it (CSV uses the union merge driver) and retry once.
          git push || (git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
