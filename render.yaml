# Render blueprint: the keeper as a background worker that never stops, redeployed automatically on every push to main.
# Secrets are set in the Render dashboard, never here. Only one keeper may run: disable .github/workflows/keeper.yml once this is live.
services:
  - type: worker
    name: gapless-keeper
    runtime: python
    plan: starter
    branch: main
    autoDeploy: true
    buildCommand: pip install -r keeper/requirements.txt
    startCommand: python keeper/loop.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.6"
      - key: GITHUB_REPOSITORY
        value: Lideeyah/gapless
      - key: KEEPER_SECRET_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: PYTH_API_KEY
        sync: false
      - key: RPC_URL
        sync: false
